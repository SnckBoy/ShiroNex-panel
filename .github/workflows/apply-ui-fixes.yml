name: Apply ShiroNex UI fixes
on:
  push:
    branches: [premium-ui-bugfixes]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surgical patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(p,a,b,n=1):
              s=Path(p).read_text()
              c=s.count(a)
              if c < n: raise SystemExit(f'Missing pattern in {p}: {a[:80]!r} (found {c})')
              s=s.replace(a,b,n)
              Path(p).write_text(s)
          p='src/pages/Dashboard.tsx'
          rep(p,"""  const points = data.map((value, index) => {\n    const x = (index / (data.length - 1)) * 100;\n    const y = 100 - (((value - min) / range) * 80 + 10);\n    return `${x},${y}`;\n  }).join(' ');""","""  const points = data.length <= 1\n    ? data.map(() => '50,50').join(' ')\n    : data.map((value, index) => {\n        const x = (index / (data.length - 1)) * 100;\n        const y = 100 - (((value - min) / range) * 80 + 10);\n        return `${x},${y}`;\n      }).join(' ');""")
          rep(p,"""      setServers(realServers.map((server) => ({\n        id: server.id,\n        name: server.name,\n        type: (server.software || 'Unknown') + (server.version ? ` ${server.version}` : ''),\n        ip: server.ipAlias || `${window.location.hostname}:${server.port || 25565}`,\n        status: server.status,\n        cpu: server.cpu || 0,\n        ram: { used: server.memory || 0, total: 4096 },\n        uptime: isNaN(Number((server as any).uptime)) ? '-' : `${Math.floor(Number((server as any).uptime) / 3600)}h ${Math.floor((Number((server as any).uptime) % 3600) / 60)}m`,\n      })));""","""      setServers(realServers.map((server) => {\n        const uptimeSeconds = Number((server as any).uptime);\n        const uptimeValid = (server as any).uptime != null && Number.isFinite(uptimeSeconds);\n        const totalRam = server.ram || server.memory || 4096;\n        return {\n          id: server.id,\n          name: server.name,\n          type: (server.software || 'Unknown') + (server.version ? ` ${server.version}` : ''),\n          ip: server.ipAlias || `${window.location.hostname}:${server.port || 25565}`,\n          status: server.status,\n          cpu: server.cpu || 0,\n          ram: { used: server.memory || 0, total: totalRam },\n          uptime: uptimeValid ? `${Math.floor(uptimeSeconds / 3600)}h ${Math.floor((uptimeSeconds % 3600) / 60)}m` : '-',\n        };\n      }));""")
          rep(p,"""    return servers.filter((server) => server.name.toLowerCase().includes(query) || server.id.toLowerCase().includes(query) || server.ip.includes(search));""","""    const safe = (value: any) => String(value ?? '').toLowerCase();\n    return servers.filter((server) =>\n      safe(server.name).includes(query) ||\n      safe(server.id).includes(query) ||\n      safe(server.ip).includes(query)\n    );""")
          rep(p,'<AnimatePresence mode="popLayout">','<AnimatePresence mode="sync">')
          p='src/pages/ServerList.tsx'
          rep(p,'bg-[var(--btn-primary-bg)] px-4 text-sm font-semibold text-[var(--btn-primary-text)] transition-colors hover:bg-zinc-200','bg-[var(--snx-primary)] px-4 text-sm font-semibold text-white transition-all hover:brightness-110')
          rep(p,'border-t-white/70','border-t-[var(--snx-primary)]')
          rep(p,'border-border-subtle bg-muted-subtle p-5 transition-colors duration-200 hover:border-border-strong hover:bg-muted','border-border bg-muted p-5 transition-all duration-200 hover:border-[var(--snx-primary-line)] hover:bg-muted')
          p='src/pages/ServerView.tsx'
          rep(p,'import React, { useEffect, useState } from "react";','import React, { useEffect, useRef, useState } from "react";')
          rep(p,'  const [actionNotice, setActionNotice] = useState<{ tone: "info" | "success" | "error"; text: string; dockerUnavailable?: boolean } | null>(null);','  const [actionNotice, setActionNotice] = useState<{ tone: "info" | "success" | "error"; text: string; dockerUnavailable?: boolean } | null>(null);\n  const [fetchError, setFetchError] = useState<string | null>(null);')
          rep(p,'  const [sidebarOpen, setSidebarOpen] = useState(false);','  const [sidebarOpen, setSidebarOpen] = useState(false);\n  const copyTimer = useRef<any>(null);')
          rep(p,'    navigator.clipboard.writeText(textToCopy);\n    setCopied(true);\n    setTimeout(() => setCopied(false), 2000);','    navigator.clipboard.writeText(textToCopy).catch(() => {});\n    setCopied(true);\n    window.clearTimeout(copyTimer.current);\n    copyTimer.current = window.setTimeout(() => setCopied(false), 2000);')
          rep(p,'      setServer(res.data);\n    } catch(e) {}','      setServer(res.data);\n      setFetchError(null);\n    } catch(e) {\n      setFetchError("Unable to load this server. Check your session or try again.");\n    }')
          rep(p,'    return () => clearInterval(interval);','    return () => { clearInterval(interval); if (copyTimer.current) window.clearTimeout(copyTimer.current); };')
          rep(p,"""  const handleAction = async (action: string) => {""","""  const confirmKill = () => {\n    if (window.confirm('Are you sure you want to force-kill this server? This may interrupt running processes.')) handleAction('kill');\n  };\n\n  const handleAction = async (action: string) => {""")
          rep(p,"onClick={() => { handleAction('kill'); setSidebarOpen(false); }}", "onClick={() => { confirmKill(); setSidebarOpen(false); }}")
          rep(p,"onClick={() => handleAction('kill')}", "onClick={confirmKill}")
          rep(p,'  if (!server) return (\n    <div className="h-full flex items-center justify-center p-8">','  if (!server) return (\n    <div className="h-full flex items-center justify-center p-8">')
          old='''      <motion.div\n        animate={{ scale: [1, 1.2, 1], rotate: [0, 180, 360] }}\n        transition={{ duration: 2, repeat: Infinity, ease: "linear" }}\n        className="w-12 h-12 border-2 border-indigo-500 border-t-transparent rounded-full"\n      />'''
          new='''      {fetchError ? (\n        <div className="max-w-md text-center">\n          <AlertTriangle className="mx-auto mb-3 h-8 w-8 text-amber-400" />\n          <p className="mb-4 text-sm text-muted-foreground">{fetchError}</p>\n          <button onClick={fetchServer} className="snx-secondary-button px-4 py-2 rounded-lg text-sm">Retry</button>\n        </div>\n      ) : (\n        <motion.div animate={{ scale: [1, 1.2, 1], rotate: [0, 180, 360] }} transition={{ duration: 2, repeat: Infinity, ease: "linear" }} className="w-12 h-12 border-2 border-indigo-500 border-t-transparent rounded-full" />\n      )}'''
          rep(p,old,new)
          rep(p,'{server.ipAlias ? `${server.ipAlias}:${server.port}` : server.port}','{server.ipAlias ? `${server.ipAlias}:${server.port}` : `${window.location.hostname}:${server.port}`}',2)
          Path('.github/workflows/apply-ui-fixes.yml').unlink()
          PY
          git diff --check
          git diff -- src/pages/Dashboard.tsx src/pages/ServerList.tsx src/pages/ServerView.tsx
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.tsx src/pages/ServerList.tsx src/pages/ServerView.tsx .github/workflows/apply-ui-fixes.yml
          git commit -m "fix(ui): apply ShiroNex dashboard and server view fixes"
          git push
