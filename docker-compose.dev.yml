services:
  shironex-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace/shironex
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 6767
      JWT_SECRET: ${JWT_SECRET:-codesandbox-development-secret-change-me}
      NODE_AUTH_SECRET: ${NODE_AUTH_SECRET:-codesandbox-node-secret-change-me}
      NODE_ENCRYPTION_KEY: ${NODE_ENCRYPTION_KEY:-codesandbox-encryption-key-change-me}
    ports:
      - "6767:6767"
      - "5173:5173"
      - "6768:6768"
    volumes:
      - .:/workspace/shironex
      - shironex_node_modules:/workspace/shironex/node_modules
      - shironex_data:/workspace/shironex/.data
      - /var/run/docker.sock:/var/run/docker.sock
    command: npm run dev

volumes:
  shironex_node_modules:
  shironex_data:
